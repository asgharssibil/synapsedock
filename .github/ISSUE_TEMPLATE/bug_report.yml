name: Bug report
description: Report a reproducible problem in SynapseDock
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SynapseDock. Do not include API keys or credentials.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the shortest reliable sequence that triggers the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and personal data before attaching anything.
  - type: checkboxes
    id: safety
    attributes:
      label: Secret check
      options:
        - label: I verified that this report contains no API keys, tokens, or credentials.
          required: true
