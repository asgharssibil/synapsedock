name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and publish
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' must match package version '$expectedTag'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive tests
        run: npm run test:coverage

      - name: Run Electron end-to-end test
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Windows installer and release files
        run: npm run release:win

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installer = "outputs/SynapseDock-Setup-$version.exe"
          $checksums = "outputs/SHA256SUMS.txt"
          $notes = "RELEASE_NOTES_v$version.md"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $installer $checksums --clobber
          } else {
            gh release create $env:RELEASE_TAG $installer $checksums `
              --target $env:GITHUB_SHA `
              --title "SynapseDock $env:RELEASE_TAG" `
              --notes-file $notes
          }
