name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Test and build on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime is available
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          foreach ($attempt in 1..3) {
            node node_modules/electron/install.js
            if (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe') { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime was not downloaded after three attempts.'
          }

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production application
        run: npm run build

      - name: Run Electron end-to-end test
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
